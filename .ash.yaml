# ASH (Automated Security Helper) configuration
# https://awslabs.github.io/automated-security-helper/docs/suppressions/

global_settings:
  suppressions:
    # Test fixtures use dummy passwords (savePass, srcPass, pass123, pw, secret).
    # These are not real credentials — suppress detect-secrets keyword findings.
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "src/lib/api.test.ts"
      reason: "Test fixture password literals, not real credentials"

    # The updater pubkey in tauri.conf.json is a minisign PUBLIC key
    # (not a secret). It must be shipped in the config for signature
    # verification.  Suppress detect-secrets high-entropy string detection.
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "src-tauri/tauri.conf.json"
      reason: "Minisign public key for update signature verification, not a secret"
    - rule_id: "SECRET-BASE64-HIGH-ENTROPY"
      path: "src-tauri/tauri.conf.json"
      reason: "Minisign public key for update signature verification, not a secret"
    - rule_id: "SECRET-HIGH-ENTROPY-STRING"
      path: "src-tauri/tauri.conf.json"
      reason: "Minisign public key for update signature verification, not a secret"
