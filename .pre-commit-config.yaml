# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # -- General ----------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: tsconfig\.json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # -- Rust --------------------------------------------------------------------
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path src-tauri/Cargo.toml --
        language: system
        types: [rust]
        pass_filenames: true

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        entry: cargo check --manifest-path src-tauri/Cargo.toml
        language: system
        types: [rust]
        pass_filenames: false

  # -- Node / TypeScript / Svelte ----------------------------------------------
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        types_or: [javascript, ts, svelte]
        exclude: node_modules/

      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types_or: [javascript, ts, svelte, css, json, markdown, yaml, html]
        exclude: node_modules/|package-lock\.json

      - id: svelte-check
        name: svelte-check
        entry: npx svelte-check --tsconfig ./tsconfig.json
        language: system
        pass_filenames: false
        types_or: [svelte, ts]

      - id: typescript
        name: tsc
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        types_or: [ts, svelte]

  # -- Security (ASH - AWS Automated Security Helper) -------------------------
  - repo: https://github.com/awslabs/automated-security-helper
    rev: v3.5.8
    hooks:
      - id: ash-simple-scan
