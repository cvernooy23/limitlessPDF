[package]
name = "limitlesspdf"
version = "0.0.2"
description = "A modern, glassy cross-platform PDF reader and editor"
authors = ["limitlessPDF"]
edition = "2021"
rust-version = "1.77"

# The library is what the desktop binary (and a future mobile target) calls
# into. Keeping logic in the lib makes it unit-testable without the shell.
[lib]
name = "limitlesspdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pure-Rust PDF reader/writer — used to persist annotations into the file
# without depending on the PDFium binary being present. The `embed_image`
# default features aren't needed; encryption support is built in.
lopdf = "0.41"

# Cryptographically-secure randomness for the 32-byte AES-256 file key.
# Matches the major version lopdf already pulls in.
getrandom = "0.4"

# PDF engine. pdfium-render loads the PDFium dynamic library at runtime, so the
# crate compiles even when the .dll/.dylib/.so isn't present yet — we surface a
# friendly "not found" status instead of failing the build.
# Default features include the `image` crate which we don't need — the OCR
# pipeline writes PPM files directly from the raw pixel buffer.
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "thread_safe"] }

# Native window blur: Mica/Acrylic on Windows, vibrancy on macOS.
[target."cfg(target_os = \"windows\")".dependencies]
window-vibrancy = "0.5"

[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
