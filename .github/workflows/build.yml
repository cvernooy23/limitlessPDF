name: build

permissions: {}

on:
  push:
    branches: [main, latest]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ""
            targets: ""
          - platform: macos-latest
            target: "universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: ""
            targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev rpm

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      - name: Build app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # ── Portable builds ──────────────────────────────────────────────

      - name: Create portable archive (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE_DIR="src-tauri/target/release/bundle"
          APPIMAGE=$(find "$BUNDLE_DIR" -name "*.AppImage" | head -1)
          if [ -n "$APPIMAGE" ]; then
            mkdir -p portable
            cp "$APPIMAGE" "portable/limitlessPDF"
            chmod +x "portable/limitlessPDF"
            cat > portable/README.txt << 'HEREDOC'
limitlessPDF — Portable Linux Build

Run directly:  ./limitlessPDF
No installation required. Needs WebKitGTK 4.1 on the host system.

To install per-user instead, run:
  ./install-user.sh
This places the app in ~/.local and creates a desktop entry.
HEREDOC
            cat > portable/install-user.sh << 'SCRIPT'
#!/bin/sh
set -e
PREFIX="$HOME/.local"
mkdir -p "$PREFIX/bin" "$PREFIX/share/applications" "$PREFIX/share/icons/hicolor/128x128/apps"
cp "$(dirname "$0")/limitlessPDF" "$PREFIX/bin/limitless-pdf"
chmod +x "$PREFIX/bin/limitless-pdf"
if [ -f "$(dirname "$0")/../src-tauri/icons/128x128.png" ]; then
  cp "$(dirname "$0")/../src-tauri/icons/128x128.png" "$PREFIX/share/icons/hicolor/128x128/apps/limitless-pdf.png"
fi
cat > "$PREFIX/share/applications/limitless-pdf.desktop" << EOF
[Desktop Entry]
Name=limitlessPDF
Comment=Modern glassy PDF reader and editor
Exec=$PREFIX/bin/limitless-pdf %F
Icon=limitless-pdf
Type=Application
Categories=Office;Viewer;
MimeType=application/pdf;
Terminal=false
EOF
echo "Installed to $PREFIX/bin/limitless-pdf"
echo "Desktop entry created. Log out and back in, or run: update-desktop-database $PREFIX/share/applications"
SCRIPT
            chmod +x portable/install-user.sh
            tar -czf "limitlessPDF-${VERSION}-linux-x86_64-portable.tar.gz" -C portable .
            rm -rf portable
          fi

      - name: Create portable archive (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP_BUNDLE=$(find src-tauri/target -name "limitlessPDF.app" -type d | head -1)
          if [ -n "$APP_BUNDLE" ]; then
            mkdir -p portable
            cp -R "$APP_BUNDLE" portable/
            cat > portable/README.txt << 'HEREDOC'
limitlessPDF — Portable macOS Build

Drag limitlessPDF.app to any folder and double-click to run.
No installation required. To install per-user, drag to ~/Applications.
HEREDOC
            cd portable
            zip -r "../limitlessPDF-${VERSION}-macos-universal-portable.zip" .
            cd ..
            rm -rf portable
          fi

      - name: Create portable archive (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = Get-ChildItem -Recurse src-tauri/target/release -Filter "limitlessPDF.exe" | Select-Object -First 1
          if ($exe) {
            New-Item -ItemType Directory -Force portable | Out-Null
            Copy-Item $exe.FullName portable/
            # Include WebView2 bootstrapper if present
            $wv2 = Get-ChildItem -Recurse src-tauri/target/release/bundle -Filter "MicrosoftEdgeWebview2Setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($wv2) { Copy-Item $wv2.FullName portable/ }
            @"
limitlessPDF - Portable Windows Build

Run limitlessPDF.exe directly. No installation required.
If WebView2 is not installed, run MicrosoftEdgeWebview2Setup.exe first.
"@ | Out-File -Encoding utf8 portable/README.txt
            Compress-Archive -Path portable/* -DestinationPath "limitlessPDF-${version}-windows-x86_64-portable.zip"
            Remove-Item -Recurse -Force portable
          }

      # ── Arch Linux package ───────────────────────────────────────────

      - name: Build Arch Linux package
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BINARY="src-tauri/target/release/limitless-pdf"
          if [ ! -f "$BINARY" ]; then
            BINARY=$(find src-tauri/target/release -maxdepth 1 -name "limitless*pdf*" -type f -executable | head -1)
          fi
          if [ -z "$BINARY" ]; then
            echo "No binary found, skipping Arch package"
            exit 0
          fi

          PKG_ROOT="archpkg/pkg/limitless-pdf"
          mkdir -p "$PKG_ROOT/usr/bin"
          mkdir -p "$PKG_ROOT/usr/share/applications"
          mkdir -p "$PKG_ROOT/usr/share/icons/hicolor/128x128/apps"

          cp "$BINARY" "$PKG_ROOT/usr/bin/limitless-pdf"
          chmod 755 "$PKG_ROOT/usr/bin/limitless-pdf"

          if [ -f "src-tauri/icons/128x128.png" ]; then
            cp "src-tauri/icons/128x128.png" "$PKG_ROOT/usr/share/icons/hicolor/128x128/apps/limitless-pdf.png"
          fi

          cat > "$PKG_ROOT/usr/share/applications/limitless-pdf.desktop" << EOF
          [Desktop Entry]
          Name=limitlessPDF
          Comment=Modern glassy PDF reader and editor
          Exec=/usr/bin/limitless-pdf %F
          Icon=limitless-pdf
          Type=Application
          Categories=Office;Viewer;
          MimeType=application/pdf;
          Terminal=false
          EOF
          # Remove leading whitespace from desktop entry
          sed -i 's/^          //' "$PKG_ROOT/usr/share/applications/limitless-pdf.desktop"

          mkdir -p "$PKG_ROOT/.PKGINFO"
          cat > "$PKG_ROOT/.PKGINFO/PKGINFO" << EOF
          pkgname = limitless-pdf
          pkgver = ${VERSION}-1
          pkgdesc = Modern glassy PDF reader and editor
          url = https://github.com/cvernooy23/limitlessPDF
          arch = x86_64
          license = MIT
          depend = webkit2gtk-4.1
          depend = gtk3
          EOF
          sed -i 's/^          //' "$PKG_ROOT/.PKGINFO/PKGINFO"

          # Build the .pkg.tar.zst
          cd "$PKG_ROOT"
          # Create .PKGINFO at root level
          mv .PKGINFO/PKGINFO .PKGINFO_file
          rm -rf .PKGINFO
          mv .PKGINFO_file .PKGINFO
          tar --zstd -cf "../../../limitless-pdf-${VERSION}-1-x86_64.pkg.tar.zst" \
            .PKGINFO usr/
          cd ../../..

      # ── Slackware package ────────────────────────────────────────────

      - name: Build Slackware package
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BINARY="src-tauri/target/release/limitless-pdf"
          if [ ! -f "$BINARY" ]; then
            BINARY=$(find src-tauri/target/release -maxdepth 1 -name "limitless*pdf*" -type f -executable | head -1)
          fi
          if [ -z "$BINARY" ]; then
            echo "No binary found, skipping Slackware package"
            exit 0
          fi

          SLACK_ROOT="slackpkg/limitless-pdf-${VERSION}-x86_64-1"
          mkdir -p "$SLACK_ROOT/usr/bin"
          mkdir -p "$SLACK_ROOT/usr/share/applications"
          mkdir -p "$SLACK_ROOT/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "$SLACK_ROOT/install"

          cp "$BINARY" "$SLACK_ROOT/usr/bin/limitless-pdf"
          chmod 755 "$SLACK_ROOT/usr/bin/limitless-pdf"

          if [ -f "src-tauri/icons/128x128.png" ]; then
            cp "src-tauri/icons/128x128.png" "$SLACK_ROOT/usr/share/icons/hicolor/128x128/apps/limitless-pdf.png"
          fi

          cat > "$SLACK_ROOT/usr/share/applications/limitless-pdf.desktop" << EOF
          [Desktop Entry]
          Name=limitlessPDF
          Comment=Modern glassy PDF reader and editor
          Exec=/usr/bin/limitless-pdf %F
          Icon=limitless-pdf
          Type=Application
          Categories=Office;Viewer;
          MimeType=application/pdf;
          Terminal=false
          EOF
          sed -i 's/^          //' "$SLACK_ROOT/usr/share/applications/limitless-pdf.desktop"

          cat > "$SLACK_ROOT/install/slack-desc" << EOF
          limitless-pdf: limitlessPDF
          limitless-pdf:
          limitless-pdf: Modern glassy PDF reader and editor.
          limitless-pdf: A fast, cross-platform PDF reader and editor with
          limitless-pdf: a modern glassy interface built with Tauri.
          limitless-pdf:
          limitless-pdf: Homepage: https://github.com/cvernooy23/limitlessPDF
          limitless-pdf:
          limitless-pdf:
          limitless-pdf:
          limitless-pdf:
          EOF
          sed -i 's/^          //' "$SLACK_ROOT/install/slack-desc"

          cd "$SLACK_ROOT"
          tar -cJf "../../limitless-pdf-${VERSION}-x86_64-1.txz" .
          cd ../..

      # ── Upload all artifacts ─────────────────────────────────────────

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: limitlesspdf-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            *.tar.gz
            *.zip
            *.pkg.tar.zst
            *.txz
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten binaries
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -name "*.msi" -o -name "*.exe" -o \
            -name "*.dmg" -o -name "*.deb" -o \
            -name "*.rpm" -o -name "*.AppImage" -o \
            -name "*.tar.gz" -o -name "*.zip" -o \
            -name "*.pkg.tar.zst" -o -name "*.txz" \
          \) -exec cp {} release-assets/ \;
          ls -lah release-assets/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            release-assets/*

  release-unstable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/latest'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten binaries
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -name "*.msi" -o -name "*.exe" -o \
            -name "*.dmg" -o -name "*.deb" -o \
            -name "*.rpm" -o -name "*.AppImage" -o \
            -name "*.tar.gz" -o -name "*.zip" -o \
            -name "*.pkg.tar.zst" -o -name "*.txz" \
          \) -exec cp {} release-assets/ \;
          ls -lah release-assets/

      - name: Compute next patch version
        id: version
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$latest_tag" ]; then
            base_version="${latest_tag#v}"
          else
            base_version=$(node -p "require('./package.json').version")
          fi

          IFS='.' read -r major minor patch <<< "$base_version"
          next_version="${major}.${minor}.$((patch + 1))"
          next_tag="v${next_version}"

          echo "next_version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "next_tag=${next_tag}" >> "$GITHUB_OUTPUT"

      - name: Create next patch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          if git rev-parse --verify "refs/tags/${NEXT_TAG}" >/dev/null 2>&1; then
            echo "Tag ${NEXT_TAG} already exists; skipping release creation."
            exit 0
          fi

          git tag "${NEXT_TAG}" "${GITHUB_SHA}"
          git push origin "${NEXT_TAG}"

          gh release create "${NEXT_TAG}" \
            --title "${NEXT_TAG}" \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            release-assets/*

          echo "Created ${NEXT_TAG} (${NEXT_VERSION}) from latest merge."
