name: Nightly

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger nightly build from latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run nightly.yml --ref latest -R ${{ github.repository }}