name: android

# Milestone spike: cross-compile the Rust + Svelte app to an Android APK.
# Runs only on the milestone branch (and on demand) — not wired into releases.
on:
  push:
    branches: [milestone/android]
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "26.1.10909125"

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install NDK, platform and build-tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install frontend deps
        run: npm ci

      - name: Initialize Android project
        run: npx tauri android init --skip-targets-install

      - name: Build debug APK (arm64)
        env:
          # Tells get-pdfium (run via beforeBuildCommand) to fetch the
          # Android libpdfium.so into jniLibs instead of the desktop lib.
          PDFIUM_TARGET: android
          PDFIUM_ANDROID_ABIS: arm64-v8a
        run: npx tauri android build --apk --debug --target aarch64

      - name: Verify libpdfium.so is packaged in the APK
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "Inspecting $APK"
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/libpdfium.so'; then
            echo "OK: libpdfium.so is bundled"
            unzip -l "$APK" | grep 'libpdfium.so'
          else
            echo "ERROR: libpdfium.so missing from APK"; unzip -l "$APK" | grep -i 'lib/' | head; exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: limitlesspdf-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
